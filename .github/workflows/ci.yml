# CI 工作流（六 job：lint / deny / test / web / desktop / bench）
#
# ── 平台可移植说明 ──────────────────────────────────────────────
# 本文件按 GitHub Actions 输出（D-R5=A）。若改用 GitLab CI 或内网自托管，
# 只需改写 runner 声明、缓存步骤与 artifact 传递方式，**六个 job 的结构与命令保持不变**。
# Action 版本号在首次启用时以各 Action 官方 README 核对一次（避免引用不存在的 tag）。
#
# ── 边界说明（重要）─────────────────────────────────────────────
# 1) 每日冒烟（T v1.12 §6.2 的 S-A/S-B/S-C，30 分钟内完成）是**本地或打包后的人工动作**，
#    **不在本工作流内**（原因：冒烟覆盖 UNC、OneDrive 占位等真实环境，CI runner 无法复现）。
# 2) test job 跑 ubuntu + windows 双平台：MVP 矩阵 M1–M8 全是 Windows（方案 11.6-4 已确认：MVP 仅 Windows 10/11），
#    Windows 是主交付平台，单元测试与语料生成/范围核对必须在 windows-latest 上过；lint/deny/bench 保持
#    ubuntu（fmt/clippy/deny 跨平台一致；Windows 专项静态检查待 Windows 专项代码出现时再评估）。
# 3) 语料步骤的**范围**：CI 只处理「自动化」子集。以下 4 条按 T v1.12 §3.2 的构造方式依赖人工操作
#    或特定环境，已在 fixtures/corpus/manual-only.txt 中**显式排除**，改由人工跟踪台账
#    fixtures/corpus/manual-results.md 记录：
#      R05（任务中断线）、E01（Excel 占用）、E02（OneDrive 释放空间）、E04（配额受限卷）
#    test job 的 check_scope.py 会强制"自动化/人工"两集合互斥且无遗漏。
#    **CI 绿灯当前 = 生成 + 范围核对 + 单元测试 + 24 条自动化语料逐条断言（24 asserted／0 partial／0 pending）**；
#    状态分布以 crates/kernel/tests/assertions.tsv 为单一来源，scripts/check_docs.py 看住各文档引用；
#    因此不能表述为"自动化语料零失败"，更不能表述为
#    "语料回归零失败"；T v1.12 §1.3 的"语料回归零失败"由自动化与人工两栏共同构成。
#
# ── 数值单源 ────────────────────────────────────────────────────
# 本文件不写死任何性能阈值。漂移阈值集中在仓库变量（Settings → Variables）中管理，
# 口径以基线《办公辅助工具产品方案》§9.1 为准。

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # 每周一次：cargo-deny 的漏洞库会更新，仅靠 push 触发会漏掉"这周新出的漏洞"
    - cron: "0 18 * * 0"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Windows runner 的 Python 默认用 cp1252 编码管道 I/O，中文输出/读取会
  # UnicodeEncodeError（CI run 40865148224 的 test·windows 失败根因之一）。
  # PYTHONUTF8 强制全 Python 步骤按 UTF-8 处理（对 Linux 无副作用）。
  PYTHONUTF8: "1"

jobs:
  # ── ① 静态检查（零容忍门禁，见 CONTRIBUTING §1①）──────────────
  lint:
    name: lint（fmt + clippy -D warnings）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      # 桌面壳是**独立 workspace**（`cargo test --manifest-path src-tauri/Cargo.toml`），
      # 上面的 `--all` 只作用于根 workspace，够不到 src-tauri。
      # 2026-11-05 发现 `src-tauri/src/tasks.rs` 里有一处不符合 rustfmt 的代码已随库多日，
      # 本地与 CI 全绿——因为没人检查过这一半。补一条，别让"格式一致"只覆盖一半代码。
      - name: rustfmt（桌面壳独立 workspace）
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: clippy（零容忍）
        run: |
          # 失败时把 lint 明细以 ::error:: 注解输出：日志下载需仓库管理权限，
          # 注解可经 check-runs API 匿名读取，避免"只看到 exit code"。
          # 新版 stable 可能引入新 lint，而本地工具链版本滞后——注解是唯一
          # 可靠的定位手段。
          set +e
          log="clippy-output.log"
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            escape() { printf '%s' "$1" | tr -d '\r' | sed 's/%/%25/g'; }
            fails=$(grep -E "^error|^warning: .*generated|--> |^note: " "$log" | head -20)
            if [ -n "$fails" ]; then
              while IFS= read -r line; do echo "::error::$(escape "$line")"; done <<< "$fails"
            else
              msg=$(tail -n 60 "$log" | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error::$msg"
            fi
            exit "$status"
          fi

  # ── ② 许可证与漏洞 + SBOM（CONTRIBUTING §1②）────────────────────
  # SBOM 工具已选 cargo-cyclonedx（ADR-0008）；同时覆盖根 workspace 与
  # src-tauri 独立 workspace 的 Cargo.lock（W0-5）。
  deny:
    name: deny（licenses + advisories + SBOM）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 cargo-deny 与 cargo-cyclonedx
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-cyclonedx --locked
      - name: 根 workspace 许可证/漏洞/来源检查
        run: cargo deny check
        # 移植代码的来源登记（方案 §4.11.2a⑤）与许可证义务（§4.11.4）由本 job 复查
      - name: 桌面壳独立 workspace 检查
        run: cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml check
      - name: SBOM 产出（根 crates + 桌面壳）
        run: |
          rm -rf sbom
          mkdir -p sbom
          for crate in kernel platform cli; do
            (cd "crates/$crate" && cargo cyclonedx --format json --override-filename "$crate" --quiet)
            mv "crates/$crate/$crate.json" sbom/
          done
          (cd src-tauri && cargo cyclonedx --format json --override-filename desktop --quiet)
          mv src-tauri/desktop.json sbom/
          ls -lh sbom
      - name: 上传 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  # ── ③ 单元测试 + 语料生成/范围核对（CONTRIBUTING §1③/§2；ubuntu + windows 双平台）──
  test:
    name: test（单元 + 语料准备）· ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 文档一致性（链接/版本/语料摘要/错误码）
        run: python scripts/check_docs.py
      - name: 国际化门禁（十二项：key 集合／占位符／硬编码中文／错误码对齐／预警类别对齐／枚举不裸露／预检类别对齐）
        run: python scripts/check_locales.py
      - name: 配置迁移样本 schema
        run: python fixtures/migrations/check_schema.py
      - name: 语料范围核对（显式排除人工项）
        run: |
          # 强制"自动化"与"人工"两集合互斥且无遗漏：
          #   - manifest.md 的脚本状态 与 manual-only.txt 必须双向一致；
          #   - 新增语料漏建脚本、或既建脚本又列人工清单，都会失败。
          # 统计会写入 $GITHUB_STEP_SUMMARY。
          python fixtures/corpus/check_scope.py
      - name: 生成语料并校验哈希/幂等
        run: |
          # 从零生成两次并比较逐字节结果；同时校验 manifest 登记的冻结哈希。
          # 人工跟踪的 4 条（R05/E01/E02/E04）本就无脚本，由 check_scope.py 显式确认。
          python fixtures/corpus/verify_corpus.py --rebuild --hashes
      - name: 单元测试 + 语料断言（24 条自动化语料：24 asserted／0 partial）
        shell: bash
        run: |
          # 单元测试 + 24 条自动化语料的逐条断言（crates/kernel/tests/corpus.rs，
          # K01–K08＋T01–T08＋R01–R04/R06＋E03＋Z01/Z02）；状态分布 24 asserted／
          # 0 partial／0 pending，见 assertions.tsv（K08 每片写 BOM 已于 2026-11-05 收口）。
          # 通过率分母只含 fixtures/ 全量中的「自动化」子集
          # （方案 §4.11.2a④：移植代码不豁免）；通过率分母不含人工项。
          #
          # 失败时把断言/panic/编译错误以 ::error:: 注解输出：日志下载需仓库
          # 管理权限，注解可经 check-runs API 匿名读取，避免"只看到 exit code"。
          set +e
          log="test-output.log"
          cargo test --workspace --all-features 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            escape() { printf '%s' "$1" | tr -d '\r' | sed 's/%/%25/g'; }
            fails=$(grep -E "^test .*FAILED|panicked at|assertion .* failed|left:|right:|error\[E[0-9]+\]|error: " "$log" | head -20)
            if [ -n "$fails" ]; then
              while IFS= read -r line; do echo "::error::$(escape "$line")"; done <<< "$fails"
            else
              msg=$(tail -n 60 "$log" | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error::$msg"
            fi
            exit "$status"
          fi
      - name: 语料幂等复检
        run: |
          # 二次生成必须不产生任何文件变更（fixtures/README.md §3 的幂等约定）
          git diff --exit-code -- fixtures/ || {
            echo "::error::语料生成不幂等：二次运行产生了文件变更";
            exit 1;
          }

  # ── ④ Web 前端构建（IPC/UI 垂直切片）──────────────────────────
  web:
    name: web（TypeScript + Vite build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: 国际化门禁（十二项：key 集合／占位符／硬编码中文／错误码对齐／预警类别对齐／枚举不裸露／预检类别对齐）
        run: python ../scripts/check_locales.py
        working-directory: web
      - name: 类型检查与构建
        run: pnpm build
        working-directory: web
      # 产物层 CSP 前置断言（ADR-0060 §4）：桌面 csp 的前提是"产物没有内联脚本、
      # 不引远端资源"。这条假设被打破时只有桌面端白屏，浏览器预览一切正常，必须门禁化。
      - name: 产物 CSP 断言（内联脚本/样式/远端引用）
        run: python ../scripts/check_dist_csp.py
        working-directory: web
      - name: 前端组件测试（Vitest：导航可达 ＋ 任务控制/撤销链）
        run: pnpm test
        working-directory: web
      # 真实浏览器（Chromium）UI 语义层：数据走浏览器 mock 夹具，
      # 不代表真机文件系统结果；真 WebView 链路仍是 scripts/e2e-tauri.mjs（需 tauri-driver）。
      - name: 安装 Playwright Chromium
        # runner 网络抖动时 Chromium 下载会失败（2026-11-11/12 两次判红均为该步，
        # 非代码问题）；transient 重试 3 次，全败才判红。
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Playwright Chromium 安装第 ${attempt} 次失败，20 秒后重试"
            sleep 20
          done
          exit 1
        working-directory: web
      - name: UI 语义测试（Playwright：C05 预览面板 ＋ S01 预检报告 ＋ 23 视图可达）
        run: pnpm test:e2e
        working-directory: web

  # ── ⑤ 桌面壳检查（Tauri 独立 workspace）──────────────────────
  desktop:
    name: desktop（Tauri cargo check ＋ 单元测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: 安装 Tauri Linux 依赖
        # apt 在 runner 网络抖动时会卡死/失败（2026-11-11 实跑 43 分钟未结束）；
        # 每条 apt 命令套 timeout（挂死转失败）＋ Acquire::Retries（瞬态重试），
        # 再以 3 次外层重试兜底。
        run: |
          for attempt in 1 2 3; do
            sudo timeout 900 apt-get -o Acquire::Retries=3 update && \
            sudo timeout 900 apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf && exit 0
            echo "Tauri 依赖安装第 ${attempt} 次失败，20 秒后重试"
            sleep 20
          done
          exit 1
      - name: 构建前端产物（Tauri context 需要 frontendDist）
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: web
      - name: 桌面壳 cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      # 壳层单测是 34 条「载体＝壳层命令」用例的执行位置（用例覆盖映射表），
      # 只 check 不跑测试会让这些证据永远只有本地口径。
      - name: 桌面壳单元测试（任务队列/预检门/恢复/日志）
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ── ⑥ 性能基准（仅主分支；与基线对比，超阈值失败）────────────────
  bench:
    name: bench（criterion，仅主分支）
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 生成基准数据（当前仅 C-3；C-1 本地按需）
        run: |
          # 数据集状态见 fixtures/README.md §6：
          #   已就绪：C-1/C-3/C-2/C-6/C-8（C-2/C-6/C-8 按需生成，不进 CI bench）；
          #   C-4/C-5：人工环境台账；C-7：阻塞（签发工具未就绪）。
          # bench job 只在主分支跑；C-1 首建涉及 10 万次小文件写入，建议后续改用预置缓存按需提供。
          python "fixtures/bench/C-3-大CSV/gen_c3.py"
          echo "C-1 体积与耗时较大，CI 内暂不生成，由本地脚本产出（fixtures/bench/C-1-目录树10万/gen_c1.py）。"
      - name: 跑基准（内核热路径 microbench）
        run: cargo bench --workspace
      - name: 取上一次主分支 bench 产物作基线
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rid=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=5" \
            | python3 -c "import sys,json,os; runs=json.load(sys.stdin)['workflow_runs']; cur=int(os.environ['GH_RUN_ID']); pick=[r['id'] for r in runs if r['id']!=cur]; print(pick[0] if pick else '')")
          if [ -z "$rid" ]; then
            echo "无更早的成功主分支运行，回退仓库种子基线（fixtures/bench/criterion-baseline.json）"
          else
            echo "baseline-run-id=$rid" >> "$GITHUB_OUTPUT"
          fi
      - name: 下载基线产物
        if: steps.baseline.outputs.baseline-run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: bench-results
          run-id: ${{ steps.baseline.outputs.baseline-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline-criterion
        continue-on-error: true
      - name: 与基线对比（漂移超阈值即失败）
        env:
          BENCH_DRIFT_PCT: ${{ vars.BENCH_DRIFT_PCT }}
        run: |
          # 口径（承接「数值单源」段）：
          #   1) 基线优先取上一次主分支成功运行的 criterion 产物（上两步下载到 baseline-criterion/
          #      ——与当前产物同布局时逐 bench 比 median 点估计）；下载失败或首跑无历史时回退
          #      仓库种子 fixtures/bench/criterion-baseline.json；
          #   2) 漂移阈值只从仓库变量 BENCH_DRIFT_PCT 注入，**不在此处写死数值**；
          #   3) §9.1 未定义微基准漂移阈值，阈值待产品所有者裁决——未设时脚本仅报告不判失败。
          base_flag=""
          if [ -d baseline-criterion ]; then base_flag="--baseline baseline-criterion"; fi
          python3 scripts/compare_criterion.py --current target/criterion $base_flag
      - name: 上传基准结果
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: target/criterion/
          if-no-files-found: warn