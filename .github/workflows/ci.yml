# CI 工作流（六 job：lint / deny / test / web / desktop / bench）
#
# ── 平台可移植说明 ──────────────────────────────────────────────
# 本文件按 GitHub Actions 输出（D-R5=A）。若改用 GitLab CI 或内网自托管，
# 只需改写 runner 声明、缓存步骤与 artifact 传递方式，**六个 job 的结构与命令保持不变**。
# Action 版本号在首次启用时以各 Action 官方 README 核对一次（避免引用不存在的 tag）。
#
# ── 边界说明（重要）─────────────────────────────────────────────
# 1) 每日冒烟（T v1.12 §6.2 的 S-A/S-B/S-C，30 分钟内完成）是**本地或打包后的人工动作**，
#    **不在本工作流内**（原因：冒烟覆盖 UNC、OneDrive 占位等真实环境，CI runner 无法复现）。
# 2) test job 跑 ubuntu + windows 双平台：MVP 矩阵 M1–M8 全是 Windows（方案 11.6-4 已确认：MVP 仅 Windows 10/11），
#    Windows 是主交付平台，单元测试与语料生成/范围核对必须在 windows-latest 上过；lint/deny/bench 保持
#    ubuntu（fmt/clippy/deny 跨平台一致；Windows 专项静态检查待 Windows 专项代码出现时再评估）。
# 3) 语料步骤的**范围**：CI 只处理「自动化」子集。以下 4 条按 T v1.12 §3.2 的构造方式依赖人工操作
#    或特定环境，已在 fixtures/corpus/manual-only.txt 中**显式排除**，改由人工跟踪台账
#    fixtures/corpus/manual-results.md 记录：
#      R05（任务中断线）、E01（Excel 占用）、E02（OneDrive 释放空间）、E04（配额受限卷）
#    test job 的 check_scope.py 会强制"自动化/人工"两集合互斥且无遗漏。
#    **CI 绿灯当前 = 生成 + 范围核对 + 单元测试通过**；24 条自动化语料的
#    逐条断言 harness 尚未实现，因此不能表述为"自动化语料零失败"，更不能表述为
#    "语料回归零失败"；T v1.12 §1.3 的"语料回归零失败"由自动化与人工两栏共同构成。
#
# ── 数值单源 ────────────────────────────────────────────────────
# 本文件不写死任何性能阈值。漂移阈值集中在仓库变量（Settings → Variables）中管理，
# 口径以基线《办公辅助工具产品方案》§9.1 为准。

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # 每周一次：cargo-deny 的漏洞库会更新，仅靠 push 触发会漏掉"这周新出的漏洞"
    - cron: "0 18 * * 0"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Windows runner 的 Python 默认用 cp1252 编码管道 I/O，中文输出/读取会
  # UnicodeEncodeError（CI run 40865148224 的 test·windows 失败根因之一）。
  # PYTHONUTF8 强制全 Python 步骤按 UTF-8 处理（对 Linux 无副作用）。
  PYTHONUTF8: "1"

jobs:
  # ── ① 静态检查（零容忍门禁，见 CONTRIBUTING §1①）──────────────
  lint:
    name: lint（fmt + clippy -D warnings）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy（零容忍）
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── ② 许可证与漏洞 + SBOM（CONTRIBUTING §1②）────────────────────
  # SBOM 工具已选 cargo-cyclonedx（ADR-0008）；同时覆盖根 workspace 与
  # src-tauri 独立 workspace 的 Cargo.lock（W0-5）。
  deny:
    name: deny（licenses + advisories + SBOM）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 cargo-deny 与 cargo-cyclonedx
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-cyclonedx --locked
      - name: 根 workspace 许可证/漏洞/来源检查
        run: cargo deny check
        # 移植代码的来源登记（方案 §4.11.2a⑤）与许可证义务（§4.11.4）由本 job 复查
      - name: 桌面壳独立 workspace 检查
        run: cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml check
      - name: SBOM 产出（根 crates + 桌面壳）
        run: |
          rm -rf sbom
          mkdir -p sbom
          for crate in kernel platform cli; do
            (cd "crates/$crate" && cargo cyclonedx --format json --override-filename "$crate" --quiet)
            mv "crates/$crate/$crate.json" sbom/
          done
          (cd src-tauri && cargo cyclonedx --format json --override-filename desktop --quiet)
          mv src-tauri/desktop.json sbom/
          ls -lh sbom
      - name: 上传 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  # ── ③ 单元测试 + 语料生成/范围核对（CONTRIBUTING §1③/§2；ubuntu + windows 双平台）──
  test:
    name: test（单元 + 语料准备）· ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 文档一致性（链接/版本/语料摘要/错误码）
        run: python scripts/check_docs.py
      - name: 配置迁移样本 schema
        run: python fixtures/migrations/check_schema.py
      - name: 语料范围核对（显式排除人工项）
        run: |
          # 强制"自动化"与"人工"两集合互斥且无遗漏：
          #   - manifest.md 的脚本状态 与 manual-only.txt 必须双向一致；
          #   - 新增语料漏建脚本、或既建脚本又列人工清单，都会失败。
          # 统计会写入 $GITHUB_STEP_SUMMARY。
          python fixtures/corpus/check_scope.py
      - name: 生成语料并校验哈希/幂等
        run: |
          # 从零生成两次并比较逐字节结果；同时校验 manifest 登记的冻结哈希。
          # 人工跟踪的 4 条（R05/E01/E02/E04）本就无脚本，由 check_scope.py 显式确认。
          python fixtures/corpus/verify_corpus.py --rebuild --hashes
      - name: 单元测试（语料回归断言待实现）
        run: cargo test --workspace --all-features
        # 当前只跑单元测试；语料逐条断言 harness 尚未实现。
        # 目标口径（实现 harness 后启用）：fixtures/ 全量中的「自动化」子集
        # （方案 §4.11.2a④：移植代码不豁免）；通过率分母不含人工项。
      - name: 语料幂等复检
        run: |
          # 二次生成必须不产生任何文件变更（fixtures/README.md §3 的幂等约定）
          git diff --exit-code -- fixtures/ || {
            echo "::error::语料生成不幂等：二次运行产生了文件变更";
            exit 1;
          }

  # ── ④ Web 前端构建（IPC/UI 垂直切片）──────────────────────────
  web:
    name: web（TypeScript + Vite build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: 类型检查与构建
        run: pnpm build
        working-directory: web

  # ── ⑤ 桌面壳检查（Tauri 独立 workspace）──────────────────────
  desktop:
    name: desktop（Tauri cargo check）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: 安装 Tauri Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: 构建前端产物（Tauri context 需要 frontendDist）
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: web
      - name: 桌面壳 cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # ── ⑥ 性能基准（仅主分支；与基线对比，超阈值失败）────────────────
  bench:
    name: bench（criterion，仅主分支）
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 生成基准数据（当前仅 C-3；C-1 本地按需）
        run: |
          # 数据集状态见 fixtures/README.md §6：
          #   已就绪：C-1/C-3/C-2/C-6/C-8（C-2/C-6/C-8 按需生成，不进 CI bench）；
          #   C-4/C-5：人工环境台账；C-7：阻塞（签发工具未就绪）。
          # bench job 只在主分支跑；C-1 首建涉及 10 万次小文件写入，建议后续改用预置缓存按需提供。
          python "fixtures/bench/C-3-大CSV/gen_c3.py"
          echo "C-1 体积与耗时较大，CI 内暂不生成，由本地脚本产出（fixtures/bench/C-1-目录树10万/gen_c1.py）。"
      - name: 跑基准（criterion 基准待实现）
        run: cargo bench --workspace
      - name: 与基线对比（漂移超阈值即失败）
        run: |
          # TODO(对比): 基线对比脚本待补。约定如下——
          #   1) 基线来自上一次主分支成功运行的 criterion 产物（artifact 或缓存）；
          #   2) 漂移阈值为仓库变量（如 BENCH_DRIFT_*），**不在此处写死数值**；
          #   3) 阈值口径以基线方案 §9.1 为准。
          echo "基线对比脚本待补：本步暂以占位跳过。"
      - name: 上传基准结果
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: target/criterion/
          if-no-files-found: warn