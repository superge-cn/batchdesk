[package]
name = "batchdesk-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "batchdesk 共享壳层适配（扫描/原生 FsAdapter/Journal/保留期），供 CLI 与桌面壳复用"

[lib]
name = "platform"
path = "src/lib.rs"

[dependencies]
batchdesk-kernel.workspace = true
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# 磁盘可用空间：std 无稳定 statvfs；libc 已作为传递依赖存在，此处只提升为直接依赖。
libc = "0.2"

# Windows 文件身份（volume serial + file index）需经 GetFileInformationByHandle：
# `std::os::windows::fs::MetadataExt` 的 volume_serial_number/file_index 仍受
# `windows_by_handle` 不稳定特性门控（stable 编译报 E0658，见 ADR-0012）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
] }
