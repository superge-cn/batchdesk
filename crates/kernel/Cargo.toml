[package]
name = "batchdesk-kernel"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "batchdesk 领域引擎（纯函数层，可编译为 WASM）"

[lib]
name = "kernel"
path = "src/lib.rs"

[dependencies]
chardetng = "1.0.0"
encoding_rs = "0.8.42"
# Plan/Apply/Journal DTOs are wire-visible (design 01 §2.1: camelCase serde).
serde = { version = "1", features = ["derive"] }
# ConfigDocument 的 patch 与 SettingValue 需要动态 JSON 值（设计 03 §2/§4；ADR-0010 同一选型）。
serde_json = "1"
