[package]
name = "batchdesk-kernel"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "batchdesk 领域引擎（纯函数层，可编译为 WASM）"

[lib]
name = "kernel"
path = "src/lib.rs"

[dependencies]
chardetng = "1.0.0"
encoding_rs = "0.8.42"
# F13 正则重命名（方案 §5.5）：regex 为有限自动机实现，线性时间且无回溯爆炸（ADR-0026）。
regex = "1"
# Plan/Apply/Journal DTOs are wire-visible (design 01 §2.1: camelCase serde).
serde = { version = "1", features = ["derive"] }
# ConfigDocument 的 patch 与 SettingValue 需要动态 JSON 值（设计 03 §2/§4；ADR-0010 同一选型）。
serde_json = "1"

[dev-dependencies]
# 纯函数微基准（CI bench job）；默认特性关掉绘图（plotters）以缩小依赖树，
# 保留 cargo_bench_support（cargo bench 集成）与 csv_reports（供跨提交对比脚本用）。
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "csv"] }

[[bench]]
name = "core_hot_paths"
harness = false
