[package]
name = "batchdesk-kernel"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "batchdesk 领域引擎（纯函数层，可编译为 WASM）"

[lib]
name = "kernel"
path = "src/lib.rs"

[dependencies]
# Plan/Apply/Journal DTOs are wire-visible (design 01 §2.1: camelCase serde).
serde = { version = "1", features = ["derive"] }
