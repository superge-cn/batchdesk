[package]
name = "batchdesk-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "batchdesk 命令行入口（方案 §9.5 的 C40，P1 预留）"

[[bin]]
name = "batchdesk"
path = "src/main.rs"

[dependencies]
batchdesk-kernel.workspace = true
batchdesk-platform.workspace = true
# PlanDocument/ApplyReport JSON output (MIT/Apache-2.0).
serde_json = "1"

# RBK-03 占用场景实机用例：以 Win32 CreateFileW(dwShareMode=0) 持独占句柄，
# 制造 std::fs 无法制造的"目标被占用"。仅 Windows 测试用，不影响其他平台。
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
