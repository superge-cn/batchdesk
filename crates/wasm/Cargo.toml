[package]
name = "batchdesk-wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
batchdesk-kernel = { path = "../kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

# Web 形态零强制力（设计 05 §2）：编译期裁掉基于 LicenseService 的阻断分支。
[features]
default = []
# wasm 目标专用；启用后 kernel 的授权阻断路径不参与编译。
web-zero-force = ["batchdesk-kernel/web-zero-force"]
