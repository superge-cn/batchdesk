# 依赖许可证/来源策略（初始白名单）
#
# 依据：OQ-13（2026-10-28 用户按推荐确认）；项目自身许可证方向见 OQ-11，待法务确认。
# 允许宽松许可证；GPL/AGPL/LGPL 默认不在白名单内，需逐案评审后再加例外。
# cargo-deny 配置语法见 https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "MIT-0",
    "LicenseRef-Proprietary",
    # 2026-10-29 用户确认：仅允许未修改的 Tauri 传递依赖使用 MPL-2.0
    # （cssparser/cssparser-macros/dtoa-short/option-ext/selectors）。
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
ignore = [
    # RUSTSEC-2024-0370：proc-macro-error 已停止维护（unmaintained，非漏洞）。
    # 传递路径：gtk-rs（glib-macros）→ wry/tauri（Linux WebKitGTK 栈），上游无可用升级；
    # 属桌面壳独立 workspace 的传递依赖，非本项目直接依赖。tauri/gtk-rs 生态迁移后移除本例外。
    # 依据：CI 首跑（2026-10-29，run 40865148224）确认其为唯一命中项，本地离线复核实一致。
    "RUSTSEC-2024-0370",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
