[workspace]

[package]
name = "batchdesk-desktop"
version = "0.1.0"
edition = "2021"
publish = false
license = "LicenseRef-Proprietary"
description = "batchdesk 桌面壳（Tauri）"

[lib]
name = "batchdesk_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "batchdesk-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
batchdesk-kernel = { path = "../crates/kernel" }
batchdesk-platform = { path = "../crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# F15 真实 Provider：唯一联网点（设计 14 §1/§12）；TLS 走 rustls，不引入 OpenSSL。
ureq = { version = "2", features = ["json", "tls"] }

[target.'cfg(windows)'.dependencies]
# OQ-44：API key 只存系统凭据库（Windows Credential Manager），不进 Config/UiState/日志。
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
rusqlite = "0.41.1"
