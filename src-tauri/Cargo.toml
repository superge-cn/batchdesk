[workspace]

[package]
name = "batchdesk-desktop"
version = "0.1.0"
edition = "2021"
publish = false
license = "LicenseRef-Proprietary"
description = "batchdesk 桌面壳（Tauri）"

[lib]
name = "batchdesk_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "batchdesk-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
batchdesk-kernel = { path = "../crates/kernel" }
batchdesk-platform = { path = "../crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[dev-dependencies]
rusqlite = "0.41.1"
